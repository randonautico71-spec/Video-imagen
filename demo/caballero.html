<!doctype html><html lang=es><meta charset=utf-8><title>Volumen 3D</title>
<style>
  @font-face{font-family:Fredoka;src:url(../assets/fonts/fredoka-latin.woff2) format('woff2');font-weight:300 700}
  html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style><canvas id=c></canvas>
<script src="../engine/core/rng.js"></script><script src="../engine/draw/util.js"></script><script src="../engine/design/tokens.js"></script><script src="../engine/motion/ease.js"></script>
<script src="../engine/cache/atlas.js"></script><script src="../engine/core/stage.js"></script><script src="../engine/text/texto.js"></script>
<script src="../engine/realismo/base.js"></script><script src="../engine/estilos/shorts.js"></script>
<script src="../engine/volumen/motor.js"></script><script src="../engine/volumen/mallas.js"></script><script src="../engine/volumen/tierra_datos.js"></script>
<script src="../engine/volumen/modelos.js"></script><script src="../engine/volumen/fondos.js"></script>
<script src="../engine/volumen/escenarios.js"></script><script src="../engine/volumen/historia.js"></script><script src="../engine/volumen/animales.js"></script><script src="../engine/volumen/felinos.js"></script><script src="../engine/volumen/gorila.js"></script><script src="../engine/volumen/caballero.js"></script>
<script>
const Q = new URLSearchParams(location.search), V = VE.vol;
const esc = VE.crearEscenario({ formato: 'vertical', estilo: 'DARK', ss: parseFloat(Q.get('ss') || '1') });
const sn = Math.sin, cs = Math.cos, PI = Math.PI;
const suelo = V.nodo({ malla: V.malla.cilindro(3, 3, 0.05, 48), pos: [0, -0.03, 0], mat: { color: '#5a5a50', esp: 0.1, envolver: 0.3 } });
const K = (o) => V.modelos.caballero(Object.assign({ apoyo: 'pies', pose: 'de_pie' }, o));
const C = (p, m, f) => V.camara({ pos: p, mira: m, arriba: [0, 1, 0], fov: f });
const VISTAS = {
  m_lado:  () => ({ n: [K({ era: 'mallas' })], cam: C([0.2, 1.0, 4.6], [0.1, 0.9, 0], 32) }),
  m_tres:  () => ({ n: [K({ era: 'mallas' })], cam: C([3.2, 1.5, 3.2], [0, 0.9, 0], 30) }),
  m_cara:  () => ({ n: [K({ era: 'mallas' })], cam: C([3.0, 1.55, 0.2], [0, 1.5, 0], 20) }),
  m_esp:   () => ({ n: [K({ era: 'mallas', pose: V.poses.cubrirse })], cam: C([3.2, 1.4, -3.0], [0, 0.9, 0], 30) }),
  m_front: () => ({ n: [K({ era: 'mallas' })], cam: C([3.6, 1.4, 1.6], [0, 0.9, 0], 30) }),
  l1: () => ({ n: [K({ era: 'mallas', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 50, codo_d: 80 }), rotEspada: [0, 0, 0] })], cam: C([0.2, 1.3, 4.2], [0.3, 1.2, 0], 30) }),
  l2: () => ({ n: [K({ era: 'mallas', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 50, codo_d: 80 }), rotEspada: [0, 0, -0.8] })], cam: C([0.2, 1.3, 4.2], [0.3, 1.2, 0], 30) }),
  l3: () => ({ n: [K({ era: 'mallas', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 50, codo_d: 80 }), rotEspada: [0, 0, 0.8] })], cam: C([0.2, 1.3, 4.2], [0.3, 1.2, 0], 30) }),
  l4: () => ({ n: [K({ era: 'mallas', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 50, codo_d: 80 }), rotEspada: [0, 0, -PI/2] })], cam: C([0.2, 1.3, 4.2], [0.3, 1.2, 0], 30) }),
  d1: () => ({ n: [K({ era: 'placas', espada: 'larga', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 55, hombro_i: 55, codo_d: 85, codo_i: 85, abrir: -18 }), rotEspada: [0, 0, -2.5] })], cam: C([0.2, 1.3, 4.2], [0.3, 1.2, 0], 30) }),
  d2: () => ({ n: [K({ era: 'placas', espada: 'larga', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 55, hombro_i: 55, codo_d: 85, codo_i: 85, abrir: -18 }), rotEspada: [0, 0, -2.5] })], cam: C([3.8, 1.3, 1.6], [0.3, 1.2, 0], 30) }),
  d3: () => ({ n: [K({ era: 'placas', espada: 'larga', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 55, hombro_i: 55, codo_d: 85, codo_i: 85, abrir_d: 0, abrir_i: 0 }), rotEspada: [0, 0, -2.5] })], cam: C([3.8, 1.3, 1.6], [0.3, 1.2, 0], 30) }),
  d4: () => ({ n: [K({ era: 'placas', espada: 'larga', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 55, hombro_i: 55, codo_d: 85, codo_i: 85, abrir_d: -18, abrir_i: 18 }), rotEspada: [0, 0, -2.5] })], cam: C([3.8, 1.3, 1.6], [0.3, 1.2, 0], 30) }),
  d5: () => ({ n: [K({ era: 'placas', espada: 'larga', pose: Object.assign({}, V.poses.de_pie, { hombro_d: 55, hombro_i: 55, codo_d: 85, codo_i: 85, abrir_d: -18, abrir_i: -18 }), rotEspada: [0, 0, -2.5] })], cam: C([3.8, 1.3, 1.6], [0.3, 1.2, 0], 30) }),
  p_lado:  () => ({ n: [K({ era: 'placas' })], cam: C([0.2, 1.0, 4.6], [0.1, 0.9, 0], 32) }),
  p_tres:  () => ({ n: [K({ era: 'placas' })], cam: C([3.2, 1.5, 3.2], [0, 0.9, 0], 30) }),
  p_cara:  () => ({ n: [K({ era: 'placas' })], cam: C([3.0, 1.55, 0.2], [0, 1.5, 0], 20) }),
  p_frente:() => ({ n: [K({ era: 'placas' })], cam: C([4.2, 1.3, 0.0], [0, 0.9, 0], 30) }),
  e_armas: () => ({ n: [V.modelos.espada({ tipo: 'armas', rot: [0, 0, 0] })], cam: C([0, 0.5, 1.6], [0, 0.4, 0], 40) }),
  e_larga: () => ({ n: [V.modelos.espada({ tipo: 'larga', rot: [0, 0, 0] })], cam: C([0, 0.5, 1.8], [0, 0.4, 0], 40) }),
  escudo:  () => ({ n: [V.modelos.escudo_triangular({ pos: [0, 0.9, 0] })], cam: C([0.8, 0.7, 2.2], [0, 0.5, 0], 36) })
};
const vista = (Q.get('v') || 'm_lado').split('?')[0];
window.renderAt = (t) => { esc.abrir(); const x = esc.ctx; const g = x.createLinearGradient(0, 0, 0, esc.H); g.addColorStop(0, '#3a4a5a'); g.addColorStop(1, '#14181e'); x.fillStyle = g; x.fillRect(0, 0, esc.W, esc.H);
  const v = VISTAS[vista](t); V.render(esc, V.nodo({ hijos: [suelo, ...v.n] }), v.cam, { ambiente: 'dia', sombras: { centro: [0, 0.5, 0], radio: 3 } }); };
window.ready = Promise.resolve();
</script>
