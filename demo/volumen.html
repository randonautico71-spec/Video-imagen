<!doctype html><html lang=es><meta charset=utf-8><title>Volumen 3D</title>
<style>
  @font-face{font-family:Fredoka;src:url(../assets/fonts/fredoka-latin.woff2) format('woff2');font-weight:300 700}
  html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style><canvas id=c></canvas>
<script src="../engine/core/rng.js"></script><script src="../engine/draw/util.js"></script><script src="../engine/design/tokens.js"></script><script src="../engine/motion/ease.js"></script>
<script src="../engine/cache/atlas.js"></script><script src="../engine/core/stage.js"></script><script src="../engine/text/texto.js"></script>
<script src="../engine/realismo/base.js"></script><script src="../engine/estilos/shorts.js"></script>
<script src="../engine/volumen/motor.js"></script><script src="../engine/volumen/mallas.js"></script><script src="../engine/volumen/tierra_datos.js"></script>
<script src="../engine/volumen/modelos.js"></script><script src="../engine/volumen/fondos.js"></script>
<script src="../engine/volumen/escenarios.js"></script><script src="../engine/volumen/historia.js"></script><script src="../engine/volumen/animales.js"></script><script src="../engine/volumen/felinos.js"></script><script src="../engine/volumen/prehistoricos.js"></script><script src="../engine/volumen/fauna.js"></script>
<script>
/* Revision del motor 3D (VE.vol). renderAt(t) con t en segundos.
   ?modo=avion      avion de Madrid a Nueva York sobre el globo (vertical por defecto)
   ?modo=tierra     globo girando
   ?modo=maniqui    figura articulada que se levanta de una silla; &rayosx=1 cambia a plano tecnico a mitad
   ?modo=vikingos   un barco vikingo llega a la costa, desembarcan, suben bajo una lluvia de flechas y rompen la puerta del castillo (22,5 s)
   ?modo=piezas     catalogo de modelos (avion, silla, nube, arboles, maniqui en varias poses)
   &lienzo=yt|vertical &ss=1 */
const Q = new URLSearchParams(location.search), modo = Q.get('modo') || 'avion', V = VE.vol, E = VE.ease;
const esc = VE.crearEscenario({ formato: Q.get('lienzo') || (modo === 'piezas' ? 'yt' : 'vertical'), estilo: 'DARK', ss: parseFloat(Q.get('ss') || '1') });
const W = esc.W, H = esc.H;

const MADRID = [40.42, -3.70], NY = [40.71, -74.01];
const ruta = V.geo.ruta(MADRID, NY, 160, (t) => 0.045 * Math.sin(Math.PI * Math.min(1, Math.max(0, t))) ** 0.35);
const rutaSuelo = V.geo.ruta(MADRID, NY, 160, 0.003);

// ---- escena de los vikingos (metros). La costa corre en X; el mar esta en z > 0 y el castillo en una colina en z = -62.
const RN = VE.real.ruido2('costa');
function alto(x, z) {
  const zc = z - 3 * Math.sin(x * 0.07) - 2 * Math.sin(x * 0.19 + 1) - 14 * Math.pow(Math.min(1, Math.max(0, (Math.abs(x) - 28) / 30)), 2);   // orilla irregular y cabos a los lados
  let h = zc > 0 ? -0.3 - 0.05 * zc : (zc > -14 ? -0.3 - 0.11 * zc : 1.24 + 0.04 * (-zc - 14));
  const d2 = (x / 32) ** 2 + ((z + 62) / 27) ** 2; h += 16 * Math.exp(-Math.pow(d2, 1.6));
  return h + (RN.fbm(x * 0.03 + 5, z * 0.03, 4) - 0.5) * 3 * Math.min(1, Math.max(0, (-zc - 6) / 20));
}
const VIK = { n: 8, barcoZ0: 85, barcoZ1: 9.2, llega: 6.0 };
function barcoEn(t) { const p = VE.tramo(t, 0, VIK.llega, E.suaveSalida), z = VIK.barcoZ0 + (VIK.barcoZ1 - VIK.barcoZ0) * p, enc = VE.tramo(t, VIK.llega - 0.6, 0.8);
  return { z, y: 0.12 * Math.sin(t * 1.4) * (1 - enc) + 0.35 * enc, cab: 0.025 * Math.sin(t * 1.1) * (1 - enc) - 0.05 * enc, ala: 0.03 * Math.sin(t * 0.9) * (1 - enc) }; }
function vikingoEn(i, t) {
  const r = VE.rng('vk' + i), zl = -5 + i * 1.25, xl = (i % 2 ? 0.7 : -0.7), B = barcoEn(t), cub = 0.55 + B.y;           // en cubierta (coordenadas locales del barco: proa hacia +Z local = -Z del mundo)
  const d1 = 8.2 - zl, t1 = VIK.llega + 1.2 + i * 0.45, ts = Math.max(VIK.llega - 0.2, t1 - d1 / 4.2), t2 = t1 + 0.75, aterriza = [xl * 3 + (r() - 0.5) * 3, -3.5 - r() * 2.5];
  const mundo = (x, z) => [-x, -z + B.z];
  if (t < ts) { const [x, z] = mundo(xl, zl); return { x, z, y: cub, pose: V.pose.mezclar('de_pie', 'pensar', 0.0), dir: -Math.PI / 2, apoyo: true }; }
  if (t < t1) { const q = Math.min(d1, (t - ts) * d1 / (t1 - ts)), [x, z] = mundo(xl * (1 - q / d1), zl + q); return { x, z, y: cub, pose: V.pose.correr((t - ts) * 1.6), dir: -Math.PI / 2 + 0 * Math.PI, apoyo: true }; }
  const [bx, bz] = mundo(0, 8.4);
  if (t < t2) { const k = (t - t1) / 0.75, x = bx + (aterriza[0] - bx) * k, z = bz + (aterriza[1] - bz) * k, y0 = cub + 0.9, y1 = alto(aterriza[0], aterriza[1]);
    return { x, z, y: y0 + (y1 - y0) * k + 2.2 * Math.sin(Math.PI * k) , pose: V.pose.mezclar('inclinado', V.pose.correr(0.25), Math.sin(Math.PI * k)), dir: Math.PI / 2, apoyo: false }; }
  // subida hacia el castillo. Papeles: 0, 3, 6 = hacheros contra la puerta; el resto se cubre con el escudo
  const hachero = i % 3 === 0, slot = [-1.1, 0, 1.1][i / 3 | 0] || 0, vel = 4.2 + r() * 0.8;
  const meta = hachero ? [slot, -46.85] : [(i % 2 ? 1 : -1) * (2.2 + r() * 2.5), -43.2 - r() * 2];
  const dx = meta[0] - aterriza[0], dz = meta[1] - aterriza[1], L = Math.hypot(dx, dz), q = Math.min(L, (t - t2) * vel), x = aterriza[0] + dx * q / L, z = aterriza[1] + dz * q / L, llega = t2 + L / vel;
  const rompe = t >= VIK.rompe;
  if (q < L) return { x, z, y: alto(x, z), pose: V.pose.correr((t - t2) * 1.5 + r()), dir: Math.atan2(-dz, dx), apoyo: true, hachero, llega };
  const pose = rompe ? V.pose.mezclar(hachero ? V.pose.hachazo(0.5) : 'cubrirse', 'saludar', VE.tramo(t, VIK.rompe + 0.3, 0.5)) : (hachero ? V.pose.hachazo((t - llega) * 1.3 + i * 0.3) : V.pose.mezclar(V.pose.correr(0.3), 'cubrirse', VE.tramo(t, llega, 0.35)));
  return { x, z, y: alto(x, z), pose, dir: Math.PI / 2, apoyo: true, hachero, llega };
}
VIK.rompe = 20.3; VIK.dur = 22.5;
/* Golpes en la puerta: instantes de impacto de los hacheros (fase 0,55 del hachazo) antes de que ceda. */
function impactos(t) { const o = []; for (const i of [0, 3, 6]) { const e = vikingoEn(i, t); if (!e.llega || t < e.llega) continue;
  for (let n = 0; ; n++) { const ti = e.llega + (n + 0.55 - ((i * 0.3) % 1)) / 1.3; if (ti > Math.min(t, VIK.rompe)) break; if (ti >= e.llega) o.push({ t: ti, x: [-1.1, 0, 1.1][i / 3 | 0], i, n }); } } return o; }
/* Arqueros (coordenadas locales del castillo; el castillo esta en [0, yC, -62] y mira a +Z). */
const ARQ = [[-10, 11, 12.4], [-7.4, 11, 12.4], [7.4, 11, 12.4], [10, 11, 12.4], [-3.6, 13.5, 13.4], [3.6, 13.5, 13.4], [-12.6, 16.5, 12.6], [12.6, 16.5, 12.6]];
function flechas(t, yC) {
  const out = []; ARQ.forEach((p, d) => { const r = VE.rng('arq' + d), fase = r() * 1.6;
    for (let k = 0; ; k++) { const t0 = 9.6 + fase + k * 1.6; if (t0 > t || t0 > VIK.dur) break; const de = [p[0], yC + p[1] + 1.45, -62 + p[2] + 0.5];
      const j = (d * 3 + k) % VIK.n, rr = VE.rng('fl' + d + '|' + k), dur0 = 1.4, e = vikingoEn(j, t0 + dur0);
      const ax = e.x + (rr() - 0.5) * 4.5, az = e.z + (rr() - 0.5) * 4.5, dist = Math.hypot(ax - de[0], az - de[2]), dur = Math.max(0.55, dist / 26);
      const f = V.efectos.flecha(de, [ax, alto(ax, az), az], t0, dur, t, { queda: 5 }); if (f) out.push(f); } });
  return out;
}
const ESC = {
  vikingos(t) {
    const hora = 'atardecer', HO = VE.real.hora(hora);
    V.fondo.cielo(esc, { hora, horizonte: 0.5, nubes: 0.5 });
    const B = barcoEn(t), barco = V.modelos.barco_vikingo({ pos: [0, B.y, B.z], rot: [B.cab, Math.PI, B.ala], vela: t < VIK.llega - 1 ? true : 'recogida' });
    const hijos = [V.modelos.terreno({ alto, x0: -110, x1: 110, z0: -130, z1: 30, n: 180 }), V.modelos.mar({ t, color: '#1f6c9a', colorBorde: '#ffc2a0', alfa: 0.93 }), barco,
      ];
    // combate: puerta golpeada y rota, astillas, arqueros y flechas
    const yC = alto(0, -48.5) - 0.25, imp = impactos(t), ult = imp.length ? imp[imp.length - 1].t : -9, golpe = Math.exp(-Math.max(0, t - ult) * 9) * (t < VIK.rompe ? 1 : 0);
    hijos.push(V.modelos.castillo({ pos: [0, yC, -62], t, golpe, puerta: VE.tramo(t, VIK.rompe, 0.45, E.suaveSalida) }));
    const sueloP = alto(0, -47);
    for (const g of imp.slice(-6)) hijos.push(...V.efectos.astillas('ast' + g.i + '|' + g.n, [g.x * 0.7, sueloP + 1.4, -47.3], g.t, t, { n: 6, vel: 3.5, suelo: sueloP, vida: 1.2 }));
    hijos.push(...V.efectos.astillas('rotura', [0, sueloP + 2.5, -47.3], VIK.rompe, t, { n: 46, vel: 7, suelo: sueloP, vida: 2.2, tam: 0.22 }));
    ARQ.forEach((p, d) => { const r = VE.rng('arq' + d), f = (((t - 9.6 - r() * 1.6) / 1.6) % 1 + 1) % 1, tensa = t < 9.6 ? 0.3 : (f < 0.75 ? f / 0.75 : 1 - (f - 0.75) / 0.25);
      hijos.push(V.modelos.defensor({ semilla: 'd' + d, pos: [p[0], yC + p[1], -62 + p[2]], rot: [0, -Math.PI / 2, 0], pose: Object.assign({}, V.poses.arquero, { codo_d: 95 + 55 * tensa, hombro_d: 85 + 7 * tensa }) })); });
    hijos.push(...flechas(t, yC));
    const vk = []; for (let i = 0; i < VIK.n; i++) { const e = vikingoEn(i, t); vk.push(e);
      hijos.push(V.modelos.vikingo({ semilla: 'v' + i, pose: e.pose, pos: [e.x, e.apoyo ? 0 : e.y, e.z], rot: [0, e.dir, 0], apoyo: e.apoyo ? 'pies' : null, suelo: e.y })); }
    // camara: 1) persigue al barco  2) en la playa viendo el desembarco  3) detras del grupo subiendo hacia el castillo
    const lider = vk.reduce((a, b) => (b.z < a.z ? b : a));
    const tomas = [
      { pos: [5.5, 3.6, B.z + 21], mira: [-1.5, 4.5, B.z - 25] },
      { pos: [13, 2.4, -12], mira: [0, 2.2, 1] },
      { pos: [lider.x + 6, lider.y + 6.5, lider.z + 19], mira: [lider.x * 0.3, lider.y + 9, lider.z - 30] },
      { pos: [9 - 1.2 * VE.tramo(t, 19, 3), alto(0, -42) + 2.4, -36 + 1.5 * VE.tramo(t, 19, 3)], mira: [-1, alto(0, -46) + 5.6, -48] }];
    const k1 = VE.tramo(t, 4.8, 1.4), k2 = VE.tramo(t, 10.4, 1.4), k3 = VE.tramo(t, 15.6, 1.6);
    const mez = (a, b, k) => ({ pos: V.v3.mezcla(a.pos, b.pos, k), mira: V.v3.mezcla(a.mira, b.mira, k) });
    const c = mez(mez(mez(tomas[0], tomas[1], k1), tomas[2], k2), tomas[3], k3), tb = Math.exp(-Math.max(0, t - VIK.rompe) * 4) * (t > VIK.rompe ? 0.22 : 0) + golpe * 0.04;
    c.pos = V.v3.sum(c.pos, [Math.sin(t * 61) * tb, Math.sin(t * 47 + 1) * tb, 0]);
    const cam = V.camara({ pos: c.pos, mira: c.mira, fov: 52, cerca: 0.1, lejos: 1500 });
    const centro = V.v3.mezcla(V.v3.mezcla(V.v3.mezcla([0, 1, B.z], [0, 1, -4], k1), [lider.x, lider.y, lider.z - 6], k2), [0, alto(0, -46) + 2, -45], k3);
    V.render(esc, V.nodo({ hijos }), cam, { ambiente: { base: 'atardecer', luz: { dir: [0.55, 0.42, -0.72], intensidad: 1.35 }, cielo: '#c9a8c0', suelo: '#7a6a50', ambiente: 0.62 },
      sombras: { centro, radio: 16 }, niebla: { color: HO.niebla, cerca: 70, lejos: 520 } });
  },

  avion(t) {
    // 0-3 s: plano general del globo con la ruta; 3-5 s: la camara baja hasta el avion; despues, camara de persecucion
    const p = VE.tramo(t, 3, 9, E.suave), k = VE.tramo(t, 2.6, 2.6, E.suave);
    V.fondo.espacio(esc, { semilla: 'avion' });
    const { pos: P, m } = V.geo.enRuta(ruta, p, Math.sin(t * 0.7) * 0.08);
    const adelante = V.v3.norm(V.v3.res(V.geo.enRuta(ruta, Math.min(1, p + 0.01)).pos, P)), arriba = V.v3.norm(P), lado = V.v3.norm(V.v3.cruz(arriba, adelante));
    const loc = (q) => V.m4.ap(m, V.v3.por(q, 0.06));                 // punto en coordenadas del avion (largo 1) -> mundo
    const cerca = { pos: loc([Number(Q.get('cx') || 0.55), Number(Q.get('cy') || 0.6), Number(Q.get('cz') || -2.7)]), mira: loc([-0.2, -0.12, 0.9]), arriba };
    const medio = V.v3.norm(V.geo.punto(48, -40)), lejos = { pos: V.v3.por(medio, 4.6), mira: [0, 0, 0], arriba: [0, 1, 0] };
    const d = V.v3.norm(V.v3.mezcla(V.v3.norm(lejos.pos), V.v3.norm(cerca.pos), k)), r = 4.6 + (V.v3.lon(cerca.pos) - 4.6) * k;
    const cam = V.camara({ pos: V.v3.por(d, r), mira: V.v3.mezcla(lejos.mira, cerca.mira, k), arriba: V.v3.norm(V.v3.mezcla(lejos.arriba, cerca.arriba, k)), fov: 42 - 6 * k, cerca: 0.005 });
    // estelas: una por motor (puntos pasados de la ruta desplazados a la altura de cada motor)
    const estelas = [1, -1].map(sg => { const e = []; for (let i = 0; i <= 40; i++) { const q = p - 0.1 * (1 - i / 40); if (q < 0) continue; const r = V.geo.enRuta(ruta, q); e.push(V.m4.ap(r.m, [sg * 0.19 * 0.06, -0.065 * 0.06, -0.01])); }
      if (e.length > 2) e.push(V.m4.ap(m, [sg * 0.19 * 0.06, -0.065 * 0.06, -0.02])); return e; });
    // CAPAS: globo -> grafismos sobre el globo -> avion y estela encima (asi el avion tapa la ruta dibujada en 2D)
    V.render(esc, V.modelos.tierra({ giroNubes: t * 0.01, atmosfera: 1 - k }), cam, { ambiente: 'espacio' });
    const oculta = (q) => !V.geo.visible(q, cam);
    V.linea(esc, cam, rutaSuelo, { color: '#ffd36b', ancho: 5, discontinua: [14, 12], progreso: VE.tramo(t, 0.6, 1.8), oculta });
    for (const [c, nombre, ent] of [[MADRID, 'MADRID', 0.4], [NY, 'NUEVA YORK', 1.6]]) { const g = V.geo.punto(c[0], c[1], 1.003); if (!V.geo.visible(g, cam)) continue;
      const a = VE.tramo(t, ent, 0.6), q = V.marcador(esc, cam, g, { a, pulso: (t * 1.3) % 1 }); if (q.delante && q.y > 0 && q.y < H) VE.short.pastilla(esc, nombre, q.x, q.y - 60 * esc.k, { a, tam: 34 }); }
    const hijos = [V.modelos.avion({ m: V.m4.mul(m, V.m4.esc(0.06)) })];
    estelas.forEach((e, i) => { if (e.length > 3) hijos.push(V.nodo({ malla: V.malla.tubo(e, (u) => 0.0008 * Math.sqrt(u), 8, { dinamica: 'estela' + i }), mat: { tipo: 'plano', color: '#ffffff', alfa: 0.55 } })); });
    V.render(esc, V.nodo({ hijos }), cam, { ambiente: 'espacio' });
    const km = Math.round(V.geo.distancia(MADRID, NY) * p);
    VE.short.pastilla(esc, km.toLocaleString('es-ES') + ' km', W / 2, H * 0.14, { a: VE.tramo(t, 3, 0.6), tam: 54, color: VE.short.COL.cian });
  },
  tierra(t) {
    V.fondo.espacio(esc, { semilla: 'tierra' });
    const cam = V.orbita([0, 0, 0], 3.6, t * 0.25 + 3.3, 0.45, { fov: 40 });
    V.render(esc, V.modelos.tierra({ giroNubes: t * 0.02 }), cam, { ambiente: 'espacio' });
  },
  maniqui(t) {
    const rx = Q.get('rayosx') === '1' ? VE.tramo(t, 4, 1.2) : 0;
    V.fondo.estudio(esc, { a: 1 - rx }); if (rx > 0) V.fondo.plano(esc, { a: rx });
    // sentado -> inclinarse -> levantarse (los pies no se mueven: apoyo 'pies' + piesX)
    const a = VE.tramo(t, 1, 1.2), b = VE.tramo(t, 2.4, 1.3);
    const pose = b > 0 ? V.pose.mezclar('inclinado', 'de_pie', b) : V.pose.mezclar('sentado', 'inclinado', a);
    const res = { muslo_d: '#ff7a3d', pierna_d: '#ff7a3d', muslo_i: '#ff7a3d', pierna_i: '#ff7a3d' }, fuerza = VE.tramo(t, 2.0, 0.4) * (1 - VE.tramo(t, 3.6, 0.5));
    const escena = V.nodo({ hijos: [V.nodo({ sinRayos: true, alfa: 1 - rx, hijos: [V.modelos.sala({})] }), V.modelos.silla({ pos: [-0.05, 0, 0] }),
      V.modelos.maniqui({ pose, apoyo: 'pies', piesX: 0.47, resaltar: fuerza > 0.5 ? res : {} })] });
    const cam = V.camara({ pos: [0.6, 1.0, 4.4], mira: [0.35, 0.8, 0], fov: 38 });
    V.render(esc, escena, cam, rx >= 1 ? { ambiente: 'plano', rayosx: 1 } : { ambiente: 'estudio', sombras: { centro: [0.2, 0.6, 0], radio: 2.2 }, rayosx: rx * 0.999 });
  },
  piezas(t) {
    V.fondo.estudio(esc, { pared: '#3b3550', foco: [0.5, 0.2] });
    const hijos = [V.nodo({ malla: V.malla.plano(30, 12), mat: { color: '#4a3a3e', borde: 0 } }),
      V.modelos.avion({ pos: [-3.6, 1.4, 0], rot: [0.25, -2.3 + t * 0.4, 0.15], esc: 2.2 }),
      V.modelos.silla({ pos: [-1.4, 0, 0.4], rot: [0, 0.6, 0], esc: 1.4 }),
      V.modelos.maniqui({ pose: 'sentado', pos: [-1.4 + 0.02, 0, 0.4], rot: [0, 0.6, 0], esc: 1.4, apoyo: 'pies' }),
      V.modelos.maniqui({ pose: V.pose.andar(t * 0.8), pos: [0.6, 0, 0], rot: [0, -0.4, 0], esc: 1.4, apoyo: 'pies' }),
      V.modelos.maniqui({ pose: 'saludar', pos: [2.1, 0, -0.4], rot: [0, -1.2, 0], esc: 1.4, apoyo: 'pies' }),
      V.modelos.arbol({ pos: [3.7, 0, -1], esc: 1.6 }), V.modelos.arbol({ tipo: 'pino', pos: [4.9, 0, -1.6], esc: 1.6, semilla: 'p' }),
      V.modelos.nube({ pos: [2.8, 3.5, -2], esc: 0.9 })];
    V.render(esc, V.nodo({ hijos }), V.camara({ pos: [0, 2.6, 9.5], mira: [0.4, 1.3, 0], fov: 46 }), { ambiente: 'estudio', sombras: { centro: [0.5, 0, 0], radio: 7 } });
  }
};
window.renderAt = (t) => { esc.abrir(); ESC[modo](t); };
window.ready = Promise.all([document.fonts.load('700 50px Fredoka')]).catch(() => {});
</script>
