<!doctype html><html lang=es><meta charset=utf-8><title>Volumen 3D</title>
<style>
  @font-face{font-family:Fredoka;src:url(../assets/fonts/fredoka-latin.woff2) format('woff2');font-weight:300 700}
  html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style><canvas id=c></canvas>
<script src="../engine/core/rng.js"></script><script src="../engine/draw/util.js"></script><script src="../engine/design/tokens.js"></script><script src="../engine/motion/ease.js"></script>
<script src="../engine/cache/atlas.js"></script><script src="../engine/core/stage.js"></script><script src="../engine/text/texto.js"></script>
<script src="../engine/realismo/base.js"></script><script src="../engine/estilos/shorts.js"></script>
<script src="../engine/volumen/motor.js"></script><script src="../engine/volumen/mallas.js"></script><script src="../engine/volumen/tierra_datos.js"></script>
<script src="../engine/volumen/modelos.js"></script><script src="../engine/volumen/fondos.js"></script>
<script>
/* Revision del motor 3D (VE.vol). renderAt(t) con t en segundos.
   ?modo=avion      avion de Madrid a Nueva York sobre el globo (vertical por defecto)
   ?modo=tierra     globo girando
   ?modo=maniqui    figura articulada que se levanta de una silla; &rayosx=1 cambia a plano tecnico a mitad
   ?modo=piezas     catalogo de modelos (avion, silla, nube, arboles, maniqui en varias poses)
   &lienzo=yt|vertical &ss=1 */
const Q = new URLSearchParams(location.search), modo = Q.get('modo') || 'avion', V = VE.vol, E = VE.ease;
const esc = VE.crearEscenario({ formato: Q.get('lienzo') || (modo === 'piezas' ? 'yt' : 'vertical'), estilo: 'DARK', ss: parseFloat(Q.get('ss') || '1') });
const W = esc.W, H = esc.H;

const MADRID = [40.42, -3.70], NY = [40.71, -74.01];
const ruta = V.geo.ruta(MADRID, NY, 160, (t) => 0.045 * Math.sin(Math.PI * Math.min(1, Math.max(0, t))) ** 0.35);
const rutaSuelo = V.geo.ruta(MADRID, NY, 160, 0.003);

const ESC = {
  avion(t) {
    // 0-3 s: plano general del globo con la ruta; 3-5 s: la camara baja hasta el avion; despues, camara de persecucion
    const p = VE.tramo(t, 3, 9, E.suave), k = VE.tramo(t, 2.6, 2.6, E.suave);
    V.fondo.espacio(esc, { semilla: 'avion' });
    const { pos: P, m } = V.geo.enRuta(ruta, p, Math.sin(t * 0.7) * 0.08);
    const adelante = V.v3.norm(V.v3.res(V.geo.enRuta(ruta, Math.min(1, p + 0.01)).pos, P)), arriba = V.v3.norm(P), lado = V.v3.norm(V.v3.cruz(arriba, adelante));
    const loc = (q) => V.m4.ap(m, V.v3.por(q, 0.06));                 // punto en coordenadas del avion (largo 1) -> mundo
    const cerca = { pos: loc([Number(Q.get('cx') || 0.55), Number(Q.get('cy') || 0.6), Number(Q.get('cz') || -2.7)]), mira: loc([-0.2, -0.12, 0.9]), arriba };
    const medio = V.v3.norm(V.geo.punto(48, -40)), lejos = { pos: V.v3.por(medio, 4.6), mira: [0, 0, 0], arriba: [0, 1, 0] };
    const d = V.v3.norm(V.v3.mezcla(V.v3.norm(lejos.pos), V.v3.norm(cerca.pos), k)), r = 4.6 + (V.v3.lon(cerca.pos) - 4.6) * k;
    const cam = V.camara({ pos: V.v3.por(d, r), mira: V.v3.mezcla(lejos.mira, cerca.mira, k), arriba: V.v3.norm(V.v3.mezcla(lejos.arriba, cerca.arriba, k)), fov: 42 - 6 * k, cerca: 0.005 });
    // estelas: una por motor (puntos pasados de la ruta desplazados a la altura de cada motor)
    const estelas = [1, -1].map(sg => { const e = []; for (let i = 0; i <= 40; i++) { const q = p - 0.1 * (1 - i / 40); if (q < 0) continue; const r = V.geo.enRuta(ruta, q); e.push(V.m4.ap(r.m, [sg * 0.19 * 0.06, -0.065 * 0.06, -0.01])); }
      if (e.length > 2) e.push(V.m4.ap(m, [sg * 0.19 * 0.06, -0.065 * 0.06, -0.02])); return e; });
    // CAPAS: globo -> grafismos sobre el globo -> avion y estela encima (asi el avion tapa la ruta dibujada en 2D)
    V.render(esc, V.modelos.tierra({ giroNubes: t * 0.01, atmosfera: 1 - k }), cam, { ambiente: 'espacio' });
    const oculta = (q) => !V.geo.visible(q, cam);
    V.linea(esc, cam, rutaSuelo, { color: '#ffd36b', ancho: 5, discontinua: [14, 12], progreso: VE.tramo(t, 0.6, 1.8), oculta });
    for (const [c, nombre, ent] of [[MADRID, 'MADRID', 0.4], [NY, 'NUEVA YORK', 1.6]]) { const g = V.geo.punto(c[0], c[1], 1.003); if (!V.geo.visible(g, cam)) continue;
      const a = VE.tramo(t, ent, 0.6), q = V.marcador(esc, cam, g, { a, pulso: (t * 1.3) % 1 }); if (q.delante && q.y > 0 && q.y < H) VE.short.pastilla(esc, nombre, q.x, q.y - 60 * esc.k, { a, tam: 34 }); }
    const hijos = [V.modelos.avion({ m: V.m4.mul(m, V.m4.esc(0.06)) })];
    estelas.forEach((e, i) => { if (e.length > 3) hijos.push(V.nodo({ malla: V.malla.tubo(e, (u) => 0.0008 * Math.sqrt(u), 8, { dinamica: 'estela' + i }), mat: { tipo: 'plano', color: '#ffffff', alfa: 0.55 } })); });
    V.render(esc, V.nodo({ hijos }), cam, { ambiente: 'espacio' });
    const km = Math.round(V.geo.distancia(MADRID, NY) * p);
    VE.short.pastilla(esc, km.toLocaleString('es-ES') + ' km', W / 2, H * 0.14, { a: VE.tramo(t, 3, 0.6), tam: 54, color: VE.short.COL.cian });
  },
  tierra(t) {
    V.fondo.espacio(esc, { semilla: 'tierra' });
    const cam = V.orbita([0, 0, 0], 3.6, t * 0.25 + 3.3, 0.45, { fov: 40 });
    V.render(esc, V.modelos.tierra({ giroNubes: t * 0.02 }), cam, { ambiente: 'espacio' });
  },
  maniqui(t) {
    const rx = Q.get('rayosx') === '1' ? VE.tramo(t, 4, 1.2) : 0;
    V.fondo.estudio(esc, { a: 1 - rx }); if (rx > 0) V.fondo.plano(esc, { a: rx });
    // sentado -> inclinarse -> levantarse (los pies no se mueven: apoyo 'pies' + piesX)
    const a = VE.tramo(t, 1, 1.2), b = VE.tramo(t, 2.4, 1.3);
    const pose = b > 0 ? V.pose.mezclar('inclinado', 'de_pie', b) : V.pose.mezclar('sentado', 'inclinado', a);
    const res = { muslo_d: '#ff7a3d', pierna_d: '#ff7a3d', muslo_i: '#ff7a3d', pierna_i: '#ff7a3d' }, fuerza = VE.tramo(t, 2.0, 0.4) * (1 - VE.tramo(t, 3.6, 0.5));
    const escena = V.nodo({ hijos: [V.nodo({ sinRayos: true, alfa: 1 - rx, hijos: [V.modelos.sala({})] }), V.modelos.silla({ pos: [-0.05, 0, 0] }),
      V.modelos.maniqui({ pose, apoyo: 'pies', piesX: 0.47, resaltar: fuerza > 0.5 ? res : {} })] });
    const cam = V.camara({ pos: [0.6, 1.0, 4.4], mira: [0.35, 0.8, 0], fov: 38 });
    V.render(esc, escena, cam, rx >= 1 ? { ambiente: 'plano', rayosx: 1 } : { ambiente: 'estudio', sombras: { centro: [0.2, 0.6, 0], radio: 2.2 }, rayosx: rx * 0.999 });
  },
  piezas(t) {
    V.fondo.estudio(esc, { pared: '#3b3550', foco: [0.5, 0.2] });
    const hijos = [V.nodo({ malla: V.malla.plano(30, 12), mat: { color: '#4a3a3e', borde: 0 } }),
      V.modelos.avion({ pos: [-3.6, 1.4, 0], rot: [0.25, -2.3 + t * 0.4, 0.15], esc: 2.2 }),
      V.modelos.silla({ pos: [-1.4, 0, 0.4], rot: [0, 0.6, 0], esc: 1.4 }),
      V.modelos.maniqui({ pose: 'sentado', pos: [-1.4 + 0.02, 0, 0.4], rot: [0, 0.6, 0], esc: 1.4, apoyo: 'pies' }),
      V.modelos.maniqui({ pose: V.pose.andar(t * 0.8), pos: [0.6, 0, 0], rot: [0, -0.4, 0], esc: 1.4, apoyo: 'pies' }),
      V.modelos.maniqui({ pose: 'saludar', pos: [2.1, 0, -0.4], rot: [0, -1.2, 0], esc: 1.4, apoyo: 'pies' }),
      V.modelos.arbol({ pos: [3.7, 0, -1], esc: 1.6 }), V.modelos.arbol({ tipo: 'pino', pos: [4.9, 0, -1.6], esc: 1.6, semilla: 'p' }),
      V.modelos.nube({ pos: [2.8, 3.5, -2], esc: 0.9 })];
    V.render(esc, V.nodo({ hijos }), V.camara({ pos: [0, 2.6, 9.5], mira: [0.4, 1.3, 0], fov: 46 }), { ambiente: 'estudio', sombras: { centro: [0.5, 0, 0], radio: 7 } });
  }
};
window.renderAt = (t) => { esc.abrir(); ESC[modo](t); };
window.ready = Promise.all([document.fonts.load('700 50px Fredoka')]).catch(() => {});
</script>
