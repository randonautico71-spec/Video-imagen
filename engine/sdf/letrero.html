<!doctype html><html lang=es><meta charset=utf-8><title>Letrero final (capa con alfa)</title>
<!-- Capa transparente con el MISMO letrero de los shorts (VE.short.letrero) para superponerla a vídeos hechos fuera del motor de canvas (p. ej. SDF).
     La genera render/letrero.cjs; se sirve con render/servidor.cjs para que cargue la fuente Fredoka. -->
<style>
  @font-face{font-family:Fredoka;src:url(/assets/fonts/fredoka-latin.woff2) format('woff2');font-weight:300 700;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2122,U+2191,U+2193,U+2212,U+FEFF}
  html,body{margin:0;background:transparent}canvas{display:block}
</style>
<canvas id=c></canvas><canvas id=a></canvas>
<script src="/engine/core/rng.js"></script>
<script src="/engine/draw/util.js"></script>
<script src="/engine/design/tokens.js"></script>
<script src="/engine/motion/ease.js"></script>
<script src="/engine/cache/atlas.js"></script>
<script src="/engine/core/stage.js"></script>
<script src="/engine/text/texto.js"></script>
<script src="/engine/qa/lint.js"></script>
<script src="/engine/estilos/shorts.js"></script>
<script>
  window.ready = (async () => {
    await document.fonts.load('700 86px Fredoka');
    const esc = VE.crearEscenario({ formato: 'vertical', ss: 1, estilo: 'DARK' });
    const a = document.getElementById('a'); a.width = esc.W; a.height = esc.H;
    esc.ctx = a.getContext('2d'); esc.ctx.imageSmoothingQuality = 'high';
    /* t = segundo del vídeo; t0 = cuándo entra el letrero. Oscurece un poco el fondo para que se lea sobre cualquier escena. */
    window.capa = (t, t0, handle) => {
      const x = esc.ctx; x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, a.width, a.height);
      const k = Math.max(0, Math.min(1, (t - t0 + 0.2) / 0.7));
      x.fillStyle = `rgba(4,8,20,${0.38 * k})`; x.fillRect(0, 0, a.width, a.height);
      VE.short.letrero(esc, t, t0, handle ? { handle } : {});
      return a.toDataURL('image/png');
    };
  })();
</script>
